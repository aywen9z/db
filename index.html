<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Evolution 60fps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0a1a;
            color: #fff;
            margin: 0;
            overflow: hidden; /* Empêche le scroll avec les flèches */
            touch-action: none; /* Empêche les gestes de navigation sur mobile */
        }

        /* Effets Néon */
        .neon-text { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc; }
        .neon-text-red { text-shadow: 0 0 5px #ff0055, 0 0 10px #ff0055; }
        .neon-border { box-shadow: 0 0 15px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.1); border: 2px solid #00ffcc; }

        /* Boutons personnalisés */
        .custom-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .custom-btn:hover { transform: translateY(-2px); }
        .custom-btn:active { transform: translateY(1px); }

        .btn-neon { background: rgba(0,255,204,0.1); border: 2px solid #00ffcc; color: #00ffcc; box-shadow: 0 0 5px rgba(0,255,204,0.5); }
        .btn-neon:hover { box-shadow: 0 0 15px #00ffcc, inset 0 0 10px #00ffcc; background: rgba(0,255,204,0.2); }

        /* Conteneur du jeu */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        canvas {
            background-color: #0d0d26;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }

        /* Overlays UI */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 26, 0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            border-radius: 8px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Boutons de sélection Menu */
        .selector-group { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .selector-btn {
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 20px;
            background: #1a1a3a;
            color: #aaa;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .selector-btn.active { background: #00ffcc; color: #0a0a1a; border-color: #00ffcc; font-weight: bold; box-shadow: 0 0 10px rgba(0,255,204,0.5); }

        /* Animation Pomme */
        @keyframes eatPulse {
            0% { box-shadow: 0 0 15px rgba(0,255,204,0.3); }
            50% { box-shadow: 0 0 30px #00ffcc, inset 0 0 20px rgba(0,255,204,0.5); }
            100% { box-shadow: 0 0 15px rgba(0,255,204,0.3); }
        }
        .eat-anim { animation: eatPulse 0.3s ease-out; }
        
        /* Contrôles mobiles */
        .mobile-controls { display: none; }
        @media (max-width: 768px) {
            .mobile-controls {
                display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
                max-width: 250px; margin: 20px auto;
            }
            .mobile-btn {
                background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.2);
                border-radius: 8px; padding: 15px; text-align: center; font-size: 24px;
                user-select: none; touch-action: manipulation;
            }
            .mobile-btn:active { background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; }
            .btn-up { grid-column: 2; }
            .btn-left { grid-column: 1; grid-row: 2; }
            .btn-down { grid-column: 2; grid-row: 2; }
            .btn-right { grid-column: 3; grid-row: 2; }
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center p-4">

    <!-- En-tête / Scores -->
    <div class="w-full max-w-[500px] flex justify-between items-center mb-4">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold neon-text m-0">SNAKE <span class="text-[#00ffcc]">60FPS</span></h1>
            <p id="ui-current-mode" class="text-xs text-gray-400 uppercase tracking-widest">Menu</p>
        </div>
        <div class="text-right">
            <div class="text-lg">Score: <span id="current-score" class="font-bold text-[#00ffcc]">0</span></div>
            <div class="text-sm text-gray-400">Record: <span id="high-score" class="font-bold text-[#ff0055]">0</span></div>
        </div>
    </div>

    <!-- Conteneur Principal -->
    <div id="game-container" class="neon-border rounded-lg relative">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Menu Principal -->
        <div id="menu-overlay" class="overlay active p-4 text-center">
            <h2 class="text-3xl font-bold text-white mb-6 tracking-widest neon-text">PARAMÈTRES</h2>
            
            <div class="mb-4 w-full">
                <p class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Mode de Jeu</p>
                <div class="selector-group" id="mode-selectors">
                    <button class="selector-btn active" onclick="selectMode('classic')">Classic</button>
                    <button class="selector-btn" onclick="selectMode('hardcore')">Hardcore</button>
                    <button class="selector-btn" onclick="selectMode('obstacle')">Obstacle</button>
                </div>
                <p id="mode-desc" class="text-xs text-[#00ffcc] mb-4 h-4">Traversez les murs librement.</p>
            </div>

            <div class="mb-8 w-full">
                <p class="text-sm text-gray-400 mb-2 uppercase tracking-wide">Apparence (Skin)</p>
                <div class="selector-group" id="skin-selectors">
                    <button class="selector-btn active" onclick="selectSkin('neon')">Neon</button>
                    <button class="selector-btn" onclick="selectSkin('python')">Python</button>
                    <button class="selector-btn" onclick="selectSkin('coral')">Coral</button>
                </div>
            </div>

            <button onclick="readyGame()" class="px-10 py-3 rounded-full font-bold text-lg custom-btn btn-neon w-full max-w-[250px]">
                JOUER
            </button>
        </div>

        <!-- Overlay Pause -->
        <div id="pause-overlay" class="overlay">
            <h2 class="text-4xl font-bold text-white mb-4 tracking-widest">PAUSE</h2>
            <button onclick="togglePause()" class="px-8 py-2 rounded-full font-bold custom-btn btn-neon mb-4">
                Reprendre
            </button>
            <button onclick="showMenu()" class="px-6 py-2 rounded-full text-sm text-gray-400 border border-gray-600 hover:text-white hover:border-white transition-all">
                Retour au Menu
            </button>
        </div>

        <!-- Overlay Game Over -->
        <div id="gameover-overlay" class="overlay">
            <h2 class="text-4xl font-bold neon-text-red mb-2 tracking-widest">GAME OVER</h2>
            <p class="text-xl mb-6">Score final: <span id="final-score" class="font-bold text-white">0</span></p>
            <button onclick="readyGame()" class="px-8 py-3 bg-[#00ffcc] text-[#0a0a1a] font-bold rounded-full custom-btn border-none mb-4 w-full max-w-[200px]">
                Rejouer
            </button>
            <button onclick="showMenu()" class="text-gray-400 hover:text-white text-sm underline transition-all">
                Changer de mode/skin
            </button>
        </div>
    </div>

    <!-- Contrôle Pause sous le jeu -->
    <div class="w-full max-w-[500px] mt-4 flex justify-center">
        <button id="pause-btn" onclick="togglePause()" class="px-6 py-2 bg-transparent border-2 border-gray-600 text-gray-400 hover:text-white hover:border-[#00ffcc] hover:shadow-[0_0_10px_#00ffcc] font-bold rounded-full transition-all text-sm opacity-50 cursor-not-allowed" disabled>
            ⏸ Pause (Espace / P)
        </button>
    </div>

    <!-- Contrôles Mobiles -->
    <div class="mobile-controls w-full">
        <div class="mobile-btn btn-up" id="btn-up">↑</div>
        <div class="mobile-btn btn-left" id="btn-left">←</div>
        <div class="mobile-btn btn-down" id="btn-down">↓</div>
        <div class="mobile-btn btn-right" id="btn-right">→</div>
    </div>

    <script>
        // --- Configurations Globales ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameContainer = document.getElementById("game-container");
        
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;

        // Configurations des modes et skins
        let currentMode = 'classic'; // classic, hardcore, obstacle
        let currentSkin = 'neon';    // neon, python, coral
        
        const modeDescriptions = {
            'classic': "Traversez les murs librement.",
            'hardcore': "Toucher un mur vous élimine.",
            'obstacle': "Évitez les rochers mortels (murs mortels)."
        };

        // Variables d'état
        let snake = [];
        let oldSnake = []; 
        let dx = 0, dy = 0;
        let foodX = 0, foodY = 0;
        let rocks = [];
        
        let score = 0;
        let highScore = localStorage.getItem("snakeEvolutionHS") || 0;
        
        let reqAnimFrameId;
        let lastTickTime = 0;
        let inputQueue = []; 
        
        let isPaused = false;
        let isGameOver = false;
        let gameStarted = false; // Le jeu boucle, mais le serpent attend une touche
        let menuActive = true;   // Le menu masque le jeu
        
        // Vitesse logique
        const baseSpeed = 140; 
        let currentSpeed = baseSpeed;
        const minSpeed = 60; 

        document.getElementById("high-score").innerText = highScore;

        // --- Gestion Menu UI ---
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('#mode-selectors .selector-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('mode-desc').innerText = modeDescriptions[mode];
        }

        function selectSkin(skin) {
            currentSkin = skin;
            document.querySelectorAll('#skin-selectors .selector-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showMenu() {
            cancelAnimationFrame(reqAnimFrameId);
            menuActive = true;
            document.getElementById("menu-overlay").classList.add("active");
            document.getElementById("pause-overlay").classList.remove("active");
            document.getElementById("gameover-overlay").classList.remove("active");
            disablePauseBtn();
        }

        function readyGame() {
            menuActive = false;
            document.getElementById("menu-overlay").classList.remove("active");
            document.getElementById("gameover-overlay").classList.remove("active");
            document.getElementById("pause-overlay").classList.remove("active");
            
            document.getElementById("ui-current-mode").innerText = `Mode: ${currentMode.toUpperCase()}`;
            
            initGameData();
        }

        function enablePauseBtn() {
            const btn = document.getElementById("pause-btn");
            btn.disabled = false;
            btn.classList.remove("opacity-50", "cursor-not-allowed");
            btn.innerText = "⏸ Pause (Espace / P)";
        }

        function disablePauseBtn() {
            const btn = document.getElementById("pause-btn");
            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");
        }

        // --- Initialisation du Jeu ---
        function initGameData() {
            // Serpent initial au centre
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 },
                { x: 10, y: 13 }
            ];
            oldSnake = JSON.parse(JSON.stringify(snake));
            
            dx = 0; dy = 0; // Attente d'input
            score = 0;
            currentSpeed = baseSpeed;
            isPaused = false;
            isGameOver = false;
            gameStarted = false;
            inputQueue = [];
            rocks = [];

            if (currentMode === 'obstacle') {
                spawnRocks(8); // Génère 8 rochers
            }

            updateScoreUI();
            spawnFood();
            disablePauseBtn(); // Pas de pause tant qu'on n'a pas bougé

            if (reqAnimFrameId) cancelAnimationFrame(reqAnimFrameId);
            
            // Premier rendu statique
            drawFrame(performance.now());
        }

        // --- Logique de Boucle ---
        function startGame(initialDx, initialDy) {
            dx = initialDx;
            dy = initialDy;
            gameStarted = true;
            enablePauseBtn();
            lastTickTime = performance.now();
            reqAnimFrameId = requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (isPaused || isGameOver || menuActive) return;

            if (timestamp - lastTickTime >= currentSpeed) {
                lastTickTime += currentSpeed; 
                updateLogic();
            }

            if (!isGameOver) {
                drawFrame(timestamp);
                reqAnimFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function updateLogic() {
            oldSnake = JSON.parse(JSON.stringify(snake));

            if (inputQueue.length > 0) {
                const nextMove = inputQueue.shift();
                dx = nextMove.dx;
                dy = nextMove.dy;
            }

            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            // --- Collisions Murs selon le mode ---
            const outOfBounds = headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount;
            
            if (outOfBounds) {
                if (currentMode === 'hardcore' || currentMode === 'obstacle') {
                    handleGameOver();
                    return;
                } else {
                    // Mode Classic : Wrap
                    headX = (headX + tileCount) % tileCount;
                    headY = (headY + tileCount) % tileCount;
                }
            }

            const head = { x: headX, y: headY };

            // --- Collisions Serpent ---
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    handleGameOver(); return;
                }
            }

            // --- Collisions Obstacles ---
            for (let rock of rocks) {
                if (head.x === rock.x && head.y === rock.y) {
                    handleGameOver(); return;
                }
            }

            snake.unshift(head);

            // --- Manger la pomme ---
            if (head.x === foodX && head.y === foodY) {
                score += 10;
                updateScoreUI();
                spawnFood();
                triggerEatAnimation();
                if (currentSpeed > minSpeed) currentSpeed -= 1.5;
                
                // Allongement : dupliquer la dernière case de oldSnake pour fluidifier l'apparition visuelle
                oldSnake.push({...oldSnake[oldSnake.length - 1]});
            } else {
                snake.pop(); 
            }
        }

        // --- Rendu Visuel (60fps avec interpolation) ---
        function drawFrame(timestamp) {
            clearCanvas();
            if (currentMode === 'obstacle') drawRocks();
            drawFood();
            
            let progress = 0;
            if (gameStarted && !isPaused && !isGameOver) {
                progress = (timestamp - lastTickTime) / currentSpeed;
                progress = Math.max(0, Math.min(1, progress));
            } else if (!gameStarted) {
                progress = 1;
            }

            drawContinuousSnake(progress);
        }

        function clearCanvas() {
            ctx.fillStyle = "#0d0d26";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Légère grille visuelle de fond
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<=canvas.width; i+=gridSize) {
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
            }
            ctx.stroke();
        }

        function drawContinuousSnake(progress) {
            let pts = [];
            
            // 1. Calcul des points interpolés
            for(let i=0; i<snake.length; i++) {
                let curr = snake[i];
                let old = oldSnake[i] || curr;
                
                let diffX = curr.x - old.x;
                let diffY = curr.y - old.y;
                let rx, ry;

                // Si wrap (téléportation du bord), on stoppe l'interpolation sur cette case
                if (Math.abs(diffX) > 1 || Math.abs(diffY) > 1) {
                    rx = curr.x; 
                    ry = curr.y;
                } else {
                    rx = old.x + diffX * progress;
                    ry = old.y + diffY * progress;
                }
                
                // Coordonnées en pixels (centre de la case)
                pts.push({
                    x: rx * gridSize + gridSize/2, 
                    y: ry * gridSize + gridSize/2,
                    gridX: curr.x, gridY: curr.y
                });
            }

            // 2. Rendu continu (de la queue vers la tête)
            for(let i = pts.length - 2; i >= 0; i--) {
                let p1 = pts[i+1];
                let p2 = pts[i];
                
                // Ne pas relier les segments qui traversent l'écran (wrap)
                let dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                if (dist > gridSize * 1.5) continue; 

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                
                // Tapering (La queue est plus fine)
                let thicknessPercent = 1 - (i / pts.length) * 0.7; // Va de 100% à 30% d'épaisseur
                let thickness = (gridSize * 0.85) * thicknessPercent;
                
                ctx.lineWidth = thickness;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                applySkinStyle(i, currentSkin);
                ctx.stroke();
            }

            // 3. Dessin des yeux (Sur la tête)
            if (pts.length > 0) {
                // Déduction de la direction du regard
                let lookDx = dx, lookDy = dy;
                if (!gameStarted) { lookDx = 0; lookDy = -1; } // Regarde en haut au start
                
                let angle = Math.atan2(lookDy, lookDx);
                drawEyes(pts[0], angle);
            }
        }

        function applySkinStyle(index, skinName) {
            ctx.shadowBlur = 0;
            if (skinName === 'neon') {
                ctx.strokeStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc";
                ctx.shadowBlur = 12;
            } 
            else if (skinName === 'python') {
                // Motif Python: Alternance Vert / Marron
                const isPattern = index % 3 === 0;
                ctx.strokeStyle = isPattern ? "#8B4513" : "#2E8B57";
            }
            else if (skinName === 'coral') {
                // Motif Corail: Rouge, Noir, Jaune
                const colors = ["#ff0000", "#000000", "#ffcc00", "#000000"];
                ctx.strokeStyle = colors[index % colors.length];
            }
        }

        function drawEyes(headPt, angle) {
            ctx.save();
            ctx.translate(headPt.x, headPt.y);
            ctx.rotate(angle);
            
            // Blanc des yeux
            ctx.fillStyle = "white";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(3, -5, 2.5, 0, Math.PI*2); // Oeil Droit
            ctx.arc(3, 5, 2.5, 0, Math.PI*2);  // Oeil Gauche
            ctx.fill();

            // Pupilles
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(4, -5, 1, 0, Math.PI*2);
            ctx.arc(4, 5, 1, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawFood() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "#ff0055";
            
            ctx.beginPath();
            // Pomme légèrement plus petite pour le style fluide
            const radius = (gridSize / 2) - 3;
            const centerX = (foodX * gridSize) + (gridSize / 2);
            const centerY = (foodY * gridSize) + (gridSize / 2);
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Petite tige (détail)
            ctx.fillStyle = "#00ff00";
            ctx.fillRect(centerX - 1, centerY - radius - 2, 2, 3);
        }

        function drawRocks() {
            ctx.fillStyle = "#555";
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;

            for (let r of rocks) {
                let rx = r.x * gridSize;
                let ry = r.y * gridSize;
                
                // Dessine un hexagone / rocher rocailleux
                ctx.beginPath();
                ctx.moveTo(rx + 5, ry + 2);
                ctx.lineTo(rx + 15, ry + 4);
                ctx.lineTo(rx + 18, ry + 12);
                ctx.lineTo(rx + 12, ry + 18);
                ctx.lineTo(rx + 4, ry + 16);
                ctx.lineTo(rx + 1, ry + 8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // --- Utilitaires de Gameplay ---
        function spawnFood() {
            let valid = false;
            while (!valid) {
                foodX = Math.floor(Math.random() * tileCount);
                foodY = Math.floor(Math.random() * tileCount);
                valid = true;
                
                for (let p of snake) if (p.x === foodX && p.y === foodY) valid = false;
                for (let r of rocks) if (r.x === foodX && r.y === foodY) valid = false;
            }
        }

        function spawnRocks(count) {
            rocks = [];
            while(rocks.length < count) {
                let rx = Math.floor(Math.random() * tileCount);
                let ry = Math.floor(Math.random() * tileCount);
                
                // Protéger le centre (zone de spawn du serpent)
                if (rx >= 7 && rx <= 13 && ry >= 7 && ry <= 13) continue;
                
                rocks.push({x: rx, y: ry});
            }
        }

        function updateScoreUI() {
            document.getElementById("current-score").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeEvolutionHS", highScore);
                document.getElementById("high-score").innerText = highScore;
            }
        }

        function triggerEatAnimation() {
            gameContainer.classList.remove("eat-anim");
            void gameContainer.offsetWidth; // Force Reflow
            gameContainer.classList.add("eat-anim");
        }

        function togglePause() {
            if (isGameOver || !gameStarted || menuActive) return;
            
            isPaused = !isPaused;
            const pauseOverlay = document.getElementById("pause-overlay");
            const pauseBtn = document.getElementById("pause-btn");

            if (isPaused) {
                cancelAnimationFrame(reqAnimFrameId);
                pauseOverlay.classList.add("active");
                pauseBtn.innerText = "▶ Reprendre";
            } else {
                pauseOverlay.classList.remove("active");
                pauseBtn.innerText = "⏸ Pause (Espace / P)";
                lastTickTime = performance.now() - (currentSpeed * 0.5); 
                reqAnimFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function handleGameOver() {
            isGameOver = true;
            disablePauseBtn();
            cancelAnimationFrame(reqAnimFrameId);
            document.getElementById("final-score").innerText = score;
            document.getElementById("gameover-overlay").classList.add("active");
            drawFrame(performance.now()); // Fige le rendu final
        }

        // --- Gestion des Entrées Clavier & Tactiles ---
        function handleInput(newDx, newDy) {
            if (menuActive || isPaused || isGameOver) return;

            // Démarre le jeu à la première touche
            if (!gameStarted) {
                startGame(newDx, newDy);
                return;
            }

            let lastPlanDx = dx;
            let lastPlanDy = dy;
            if (inputQueue.length > 0) {
                lastPlanDx = inputQueue[inputQueue.length - 1].dx;
                lastPlanDy = inputQueue[inputQueue.length - 1].dy;
            }

            const isHorizontal = lastPlanDy === 0;
            const isVertical = lastPlanDx === 0;

            // Bloquer les demi-tours et spam
            if ((isHorizontal && newDy !== 0) || (isVertical && newDx !== 0)) {
                if (inputQueue.length < 2) {
                    inputQueue.push({ dx: newDx, dy: newDy });
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.key.toLowerCase() === "p") {
                e.preventDefault(); togglePause(); return;
            }
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();

            if (e.key === "ArrowLeft") handleInput(-1, 0);
            else if (e.key === "ArrowUp") handleInput(0, -1);
            else if (e.key === "ArrowRight") handleInput(1, 0);
            else if (e.key === "ArrowDown") handleInput(0, 1);
        });

        // Event tactiles
        document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(0, -1); });
        document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(0, 1); });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(-1, 0); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(1, 0); });

        // Empêche le rebond élastique sur iOS
        document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    </script>
</body>
</html>
